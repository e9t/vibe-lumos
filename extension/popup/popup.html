<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lumos</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">💡 Lumos</span>
    <div class="header-actions">
      <button id="btn-pri-down" class="header-btn hidden" title="Priority down">👎</button>
      <button id="btn-pri-up" class="header-btn hidden" title="Priority up">👍</button>
      <button id="btn-save-page" class="header-btn" title="Save current page">📄 Save Page</button>
      <button id="btn-delete-page" class="header-btn hidden" title="Delete page and all items">🗑</button>
    </div>
  </div>

  <div id="status" class="status hidden"></div>

  <div id="items-container">
    <div id="loading" class="dim">Loading…</div>
    <div id="empty" class="dim hidden">No items saved for this page.</div>
    <ul id="items-list" class="hidden"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
