<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lumos</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="header-row">
      <span class="logo">💡 Lumos</span>
      <div class="header-actions">
        <label class="cache-toggle" title="Also cache page content">
          <input type="checkbox" id="chk-cache" />
          <span class="cache-toggle-label">📋</span>
        </label>
        <button id="btn-save-page" class="header-btn primary" title="Save current page (+ cache if checked)">📄 Save</button>
      </div>
    </div>
    <div id="page-actions" class="header-row page-actions hidden">
      <div class="header-actions">
        <button id="btn-pri-up" class="header-btn" title="Priority up">👍</button>
        <button id="btn-pri-down" class="header-btn" title="Priority down">👎</button>
      </div>
      <div class="header-actions">
        <button id="btn-view-cache" class="header-btn" title="View cached page">📋 Cache</button>
        <button id="btn-delete-page" class="header-btn danger" title="Delete page and all items">🗑 Delete</button>
      </div>
    </div>
  </div>

  <div id="status" class="status hidden"></div>

  <div id="items-container">
    <div id="loading" class="dim">Loading…</div>
    <div id="empty" class="dim hidden">No items saved for this page.</div>
    <ul id="items-list" class="hidden"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
